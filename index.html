<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salve Dados - Backup Local</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Barra de rolagem customizada */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <div class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- Cabeçalho -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                Salve Dados
            </h1>
            <p class="text-slate-400 mt-2 text-sm sm:text-base">
                Gerencie seus dados locais de forma segura e exporte em formato de texto limpo.
            </p>
        </header>

        <main class="grid grid-cols-1 gap-8">
            
            <!-- FORMULÁRIO DE CADASTRO -->
            <section class="bg-slate-800 border border-slate-700/50 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold text-blue-400 mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                    Novo Registro
                </h2>
                
                <form id="formCadastro" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nome Completo</label>
                        <input type="text" id="nome" required class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="João Silva">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">E-mail</label>
                        <input type="email" id="email" required class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="joao@email.com">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">CPF</label>
                        <input type="text" id="cpf" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="000.000.000-00">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">RG</label>
                        <input type="text" id="rg" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="00.000.000-0">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Telefone</label>
                        <input type="tel" id="telefone" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="(11) 99999-9999">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Chave Pix</label>
                        <input type="text" id="pix" class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="E-mail, CPF, Telefone ou Aleatória">
                    </div>
                    
                    <div class="sm:col-span-2 mt-2">
                        <button type="submit" class="w-full sm:w-auto float-right bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors shadow-lg shadow-blue-600/10">
                            Adicionar à Lista
                        </button>
                    </div>
                </form>
            </section>

            <!-- TABELA E EXPORTAÇÃO -->
            <section class="bg-slate-800 border border-slate-700/50 rounded-2xl p-6 shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                        Registros Salvos
                    </h2>
                    
                    <!-- Botão de Exportar .txt -->
                    <button id="btnDownloadTxt" class="w-full sm:w-auto flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-all shadow-md">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                        Salvar Arquivo .txt
                    </button>
                </div>

                <!-- Tabela Responsiva -->
                <div class="overflow-x-auto w-full rounded-xl border border-slate-700/60">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-700/40 text-slate-300 text-xs uppercase tracking-wider border-b border-slate-700">
                                <th class="py-3 px-4">Nome</th>
                                <th class="py-3 px-4">E-mail</th>
                                <th class="py-3 px-4">CPF / RG</th>
                                <th class="py-3 px-4">Contato / Pix</th>
                                <th class="py-3 px-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCorpo" class="divide-y divide-slate-700/50 text-sm text-slate-300">
                            <!-- Inserido dinamicamente via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- LOGICA JAVASCRIPT -->
    <script>
        const CHAVE_STORAGE = 'salve_dados_app';

        // Carrega os dados iniciais do LocalStorage ou inicia um array vazio
        let bancoDados = JSON.parse(localStorage.getItem(CHAVE_STORAGE)) || [];

        const form = document.getElementById('formCadastro');
        const tabelaCorpo = document.getElementById('tabelaCorpo');
        const btnTxt = document.getElementById('btnDownloadTxt');

        // Função para mostrar a mensagem Toast de sucesso elegante
        function mostrarMensagemSucesso() {
            const toast = document.createElement('div');
            
            toast.className = "fixed bottom-5 right-5 bg-slate-800 border border-blue-500/30 text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3 transform translate-y-10 opacity-0 transition-all duration-300 z-50";
            
            toast.innerHTML = `
                <div class="bg-blue-500/10 p-1.5 rounded-lg text-cyan-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                <div>
                    <p class="font-semibold text-sm text-white">Backup Concluído!</p>
                    <p class="text-xs text-slate-400">Arquivo salvo na sua pasta de Downloads.</p>
                </div>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 100);
            
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // Função para renderizar as linhas da tabela
        function renderizarTabela() {
            tabelaCorpo.innerHTML = '';

            if (bancoDados.length === 0) {
                tabelaCorpo.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-slate-500 italic">
                            Nenhum registro armazenado até o momento.
                        </td>
                    </tr>
                `;
                return;
            }

            bancoDados.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/20 transition-colors";
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-medium text-white">${item.nome}</td>
                    <td class="py-3.5 px-4 text-slate-400">${item.email}</td>
                    <td class="py-3.5 px-4">
                        <div class="text-xs">CPF: <span class="text-slate-400">${item.cpf || '-'}</span></div>
                        <div class="text-xs">RG: <span class="text-slate-400">${item.rg || '-'}</span></div>
                    </td>
                    <td class="py-3.5 px-4">
                        <div class="text-xs">Tel: <span class="text-slate-400">${item.telefone || '-'}</span></div>
                        <div class="text-xs">Pix: <span class="text-slate-400">${item.pix || '-'}</span></div>
                    </td>
                    <td class="py-3.5 px-4 text-center">
                        <button onclick="excluirRegistro(${index})" class="text-red-400 hover:text-red-500 p-1.5 rounded bg-red-500/10 hover:bg-red-500/20 transition-colors" title="Excluir">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </td>
                `;
                tabelaCorpo.appendChild(tr);
            });
        }

        // Evento de Submissão do Formulário
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const novoRegistro = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                cpf: document.getElementById('cpf').value,
                rg: document.getElementById('rg').value,
                telefone: document.getElementById('telefone').value,
                pix: document.getElementById('pix').value
            };

            bancoDados.push(novoRegistro);
            localStorage.setItem(CHAVE_STORAGE, JSON.stringify(bancoDados));

            form.reset();
            renderizarTabela();
        });

        // Função global para excluir registros individuais
        window.excluirRegistro = function(index) {
            if (confirm(`Tem certeza que deseja excluir o registro de ${bancoDados[index].nome}?`)) {
                bancoDados.splice(index, 1);
                localStorage.setItem(CHAVE_STORAGE, JSON.stringify(bancoDados));
                renderizarTabela();
            }
        }

        // Geração e Download do Arquivo .txt com aviso Toast (Corrigido com Template Strings)
        btnTxt.addEventListener('click', () => {
            if (bancoDados.length === 0) {
                alert('Não há dados cadastrados para exportar.');
                return;
            }

            const dataFormatada = new Date().toLocaleString('pt-BR');
            let txtContent = `=========================================\n`;
            txtContent += `             SALVE DADOS - BACKUP        \n`;
            txtContent += ` Gerado em: ${dataFormatada} \n`;
            txtContent += `=========================================\n\n`;

            bancoDados.forEach((item, index) => {
                txtContent += `-----------------------------------------\n`;
                txtContent += ` REGISTRO #${index + 1}\n`;
                txtContent += `-----------------------------------------\n`;
                txtContent += `Nome Completo : ${item.nome}\n`;
                txtContent += `E-mail        : ${item.email}\n`;
                txtContent += `CPF           : ${item.cpf || 'Não informado'}\n`;
                txtContent += `RG            : ${item.rg || 'Não informado'}\n`;
                txtContent += `Telefone      : ${item.telefone || 'Não informado'}\n`;
                txtContent += `Chave Pix     : ${item.pix || 'Não informado'}\n\n`;
            });

            const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            
            const dataIso = new Date().toISOString().slice(0, 10);
            link.download = `Backup_SalveDados_${dataIso}.txt`;
            
            document.body.appendChild(link);
            link.click();
            
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            // Dispara a mensagem de feedback na tela
            mostrarMensagemSucesso();
        });

        // Execução inicial ao abrir a página
        renderizarTabela();
    </script>
</body>
</html>
